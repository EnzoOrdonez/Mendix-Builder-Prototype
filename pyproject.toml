[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mendex"
version = "0.1.0"
description = "Agente de IA para automatizar generación de formularios en Mendix 10.24"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Enzo Ordonez", email = "enzo.ordonez@aloe.ulima.edu.pe" },
]
keywords = ["mendix", "low-code", "ai-agent", "form-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    # REST Server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-mcp>=0.2",
    # LLM
    "anthropic>=0.40",
    # RAG / Knowledge Base
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # HTTP Client (Figma API)
    "httpx>=0.27",
    # Excel Parser
    "openpyxl>=3.1",
    # YAML & Validation
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # Settings
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # SQLite async (cache)
    "aiosqlite>=0.20",
    # Logging
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
mendex = "mendex.cli.app:app"

[project.urls]
Repository = "https://github.com/EnzoOrdonez/Mendix-Builder-Prototype"

# --- Hatch ---
[tool.hatch.build.targets.wheel]
packages = ["src/mendex"]

[tool.hatch.envs.default]
path = ".venv"

# --- Ruff ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests (require Mendix Model SDK)",
    "integration: integration tests",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore:mount\\(\\) is deprecated:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

# --- MyPy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
